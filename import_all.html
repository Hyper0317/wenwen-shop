function log(msg, type) {
  const div = document.getElementById('log');
  const span = document.createElement('span');
  if (type === 'ok') span.className = 'ok';
  if (type === 'err') span.className = 'err';
  if (type === 'warn') span.className = 'warn';
  if (type === 'info') span.className = 'info';
  span.textContent = msg + '\n';
  div.appendChild(span);
  div.scrollTop = div.scrollHeight;
}

async function doImport() {
  const btn = document.getElementById('importBtn');
  btn.disabled = true;
  btn.textContent = '导入中...';

  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  };
  const headersMinimal = {...headers, 'Prefer': 'return=minimal'};

  let okCount = 0, errCount = 0;

  try {
    // 1. categories - 先清空再插入
    log('1/5 导入 categories（14条分类）...', 'info');
    try {
      await fetch(SUPABASE_URL + '/rest/v1/categories?id=neq.DELETE_SENTINEL', { method: 'DELETE', headers: headersMinimal });
      const resp = await fetch(SUPABASE_URL + '/rest/v1/categories', { method: 'POST', headers, body: JSON.stringify(CAT_ROWS) });
      const result = await resp.json();
      if (Array.isArray(result) && result.length === 14) { log('   ✅ categories: ' + result.length + ' 条', 'ok'); okCount++; }
      else { log('   ⚠️ categories: 返回 ' + (Array.isArray(result) ? result.length : JSON.stringify(result)), 'warn'); okCount++; }
    } catch(e) { log('   ❌ categories 失败: ' + e.message, 'err'); errCount++; }

    // 2. repair_records - upsert
    log('2/5 导入 repair_records（9条维修记录）...', 'info');
    try {
      const resp = await fetch(SUPABASE_URL + '/rest/v1/repair_records?id=neq.DELETE_SENTINEL', { method: 'DELETE', headers: headersMinimal });
      const resp2 = await fetch(SUPABASE_URL + '/rest/v1/repair_records', { method: 'POST', headers, body: JSON.stringify(REPAIR_ROWS) });
      const result2 = await resp2.json();
      if (Array.isArray(result2) && result2.length === 9) { log('   ✅ repair_records: ' + result2.length + ' 条', 'ok'); okCount++; }
      else { log('   ⚠️ repair_records: 返回 ' + (Array.isArray(result2) ? result2.length : JSON.stringify(result2)), 'warn'); okCount++; }
    } catch(e) { log('   ❌ repair_records 失败: ' + e.message, 'err'); errCount++; }

    // 3. tools - 先清空再插入
    log('3/5 导入 tools（9条工具）...', 'info');
    try {
      await fetch(SUPABASE_URL + '/rest/v1/tools?id=neq.DELETE_SENTINEL', { method: 'DELETE', headers: headersMinimal });
      const resp = await fetch(SUPABASE_URL + '/rest/v1/tools', { method: 'POST', headers, body: JSON.stringify(TOOLS_DATA) });
      const result = await resp.json();
      if (Array.isArray(result) && result.length === 9) { log('   ✅ tools: ' + result.length + ' 条', 'ok'); okCount++; }
      else { log('   ⚠️ tools: 返回 ' + (Array.isArray(result) ? result.length : JSON.stringify(result)), 'warn'); okCount++; }
    } catch(e) { log('   ❌ tools 失败: ' + e.message, 'err'); errCount++; }

    // 4. tool_loans - 先清空再插入（tools 字段是 JSON 对象数组）
    log('4/5 导入 tool_loans（10条借出记录）...', 'info');
    try {
      await fetch(SUPABASE_URL + '/rest/v1/tool_loans?id=neq.DELETE_SENTINEL', { method: 'DELETE', headers: headersMinimal });
      const resp = await fetch(SUPABASE_URL + '/rest/v1/tool_loans', { method: 'POST', headers, body: JSON.stringify(LOAN_ROWS) });
      const result = await resp.json();
      if (Array.isArray(result) && result.length === 10) { log('   ✅ tool_loans: ' + result.length + ' 条', 'ok'); okCount++; }
      else { log('   ⚠️ tool_loans: 返回 ' + (Array.isArray(result) ? result.length : JSON.stringify(result)), 'warn'); okCount++; }
    } catch(e) { log('   ❌ tool_loans 失败: ' + e.message, 'err'); errCount++; }

    // 5. preferences - upsert
    log('5/5 导入 preferences（偏好设置）...', 'info');
    try {
      const resp = await fetch(SUPABASE_URL + '/rest/v1/preferences', { method: 'POST', headers: {...headers, 'Prefer': 'return=representation,resolution=merge-duplicates'}, body: JSON.stringify([PREFS_DATA]) });
      const result = await resp.json();
      if (Array.isArray(result) && result.length >= 1) { log('   ✅ preferences: 导入成功', 'ok'); okCount++; }
      else { log('   ⚠️ preferences: 返回 ' + JSON.stringify(result), 'warn'); okCount++; }
    } catch(e) { log('   ❌ preferences 失败: ' + e.message, 'err'); errCount++; }

    // 汇总
    log('\n========== 汇总 ==========', 'info');
    log('成功: ' + okCount + '/5 张表', okCount === 5 ? 'ok' : 'warn');
    if (errCount > 0) log('失败: ' + errCount + ' 张表', 'err');
    if (okCount === 5) {
      log('\n✅ 全部 5 张表导入成功！\n请刷新网页版查看。', 'ok');
    } else {
      log('\n⚠️ 部分表导入失败，请检查上方日志。', 'warn');
    }

    btn.textContent = '导入完成';
  } catch (e) {
    log('错误: ' + e.message, 'err');
    btn.disabled = false;
    btn.textContent = '重新导入';
  }
}
