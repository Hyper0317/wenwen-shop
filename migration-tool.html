function sbXHR(m,u,h,b){return new Promise(function(res,rej){var x=new XMLHttpRequest();x.open(m,u,true);for(var k in h){if(h.hasOwnProperty(k))x.setRequestHeader(k,h[k]);}x.timeout=30000;x.onreadystatechange=function(){if(x.readyState===4){if(x.status>=200&&x.status<300){try{res(JSON.parse(x.responseText));}catch(e){res(x.responseText);}}else{rej(new Error(m+" "+u+" failed: "+x.status+" "+x.responseText));}}};x.onerror=function(){rej(new Error("network error"));};x.ontimeout=function(){rej(new Error("timeout"));};x.send(b||null);});}

async function upsert(table,rows,conf){var url=SUPABASE_URL+"/rest/v1/"+table;var h=sbHeaders();if(conf){url+="?on_conflict="+conf;h["Prefer"]="return=representation,resolution=merge-duplicates";}var bs=200;var total=0;for(var i=0;i<rows.length;i+=bs){var batch=rows.slice(i,i+bs);var r=await sbXHR("POST",url,h,JSON.stringify(batch));total+=Array.isArray(r)?r.length:0;}return total;}
async function countT(table){var url=SUPABASE_URL+"/rest/v1/"+table+"?select=*";var r=await sbXHR("GET",url,sbHeaders(),null);return Array.isArray(r)?r.length:0;}
