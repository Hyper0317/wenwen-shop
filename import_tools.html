<script>

const LOANS_DATA = [{"id": "TL1786847967656", "borrower": "王博", "phone": "17739025292", "address": "太扑寨", "tools": [{"toolId": "T003", "toolName": "切割机", "quantity": 1, "unit": "台"}], "seller": "雯妈", "loanDate": "2026-08-16", "expectedReturnDate": "", "actualReturnDate": "2026-08-16", "deposit": 0, "note": "", "status": "returned", "createdAt": "2026-08-16T02:39:27.656Z"}, {"id": "TL1786934772614", "borrower": "胡莲", "phone": "19253637621", "address": "东关庄", "tools": [{"toolId": "T004", "toolName": "胶枪", "quantity": 1, "unit": "把"}], "seller": "雯雯", "loanDate": "2026-08-17", "expectedReturnDate": "", "actualReturnDate": "2026-08-17", "deposit": 0, "note": "", "status": "returned", "createdAt": "2026-08-17T02:46:12.614Z"}, {"id": "TL1787133432001", "borrower": "王国廷", "phone": "15836957054", "address": "胡村", "tools": [{"toolId": "T006", "toolName": "打灰机", "quantity": 1, "unit": "个"}], "seller": "雯妈", "loanDate": "2026-08-19", "expectedReturnDate": "", "actualReturnDate": "2026-08-23", "deposit": 0, "note": "", "status": "returned", "createdAt": "2026-08-19T09:57:12.001Z"}, {"id": "TL1787279508763", "borrower": "李鹏", "phone": "13733775917", "address": "刘七", "tools": [{"toolId": "T007", "toolName": "160水钻头", "quantity": 1, "unit": "把"}], "seller": "雯妈", "loanDate": "2026-08-21", "expectedReturnDate": "", "actualReturnDate": "2026-08-22", "deposit": 0, "note": "", "status": "returned", "createdAt": "2026-08-21T02:31:48.764Z"}, {"id": "TL1787446127911", "borrower": "张进", "phone": "19283753686", "address": "西关庄", "tools": [{"toolId": "T008", "toolName": "热溶机", "quantity": 1, "unit": "把"}], "seller": "雯妈", "loanDate": "2026-08-23", "expectedReturnDate": "", "actualReturnDate": "2026-08-23", "deposit": 0, "note": "", "status": "returned", "createdAt": "2026-08-23T00:48:47.911Z"}, {"id": "TL1787446153816", "borrower": "张进", "phone": "", "address": "西关庄", "tools": [{"toolId": "T009", "toolName": "剪刀", "quantity": 1, "unit": "把"}], "seller": "", "loanDate": "2026-08-23", "expectedReturnDate": "", "actualReturnDate": "2026-08-23", "deposit": 0, "note": "", "status": "returned", "createdAt": "2026-08-23T00:49:13.816Z"}, {"id": "TL1787617064623", "borrower": "赵寨", "phone": "13087069252", "address": "赵寨", "tools": [{"toolId": "T004", "toolName": "胶枪", "quantity": 1, "unit": "把"}], "seller": "", "loanDate": "2026-08-25", "expectedReturnDate": "", "actualReturnDate": "2026-08-28", "deposit": 0, "note": "", "status": "returned", "createdAt": "2026-08-25T00:17:44.623Z"}, {"id": "TL1787617331997", "borrower": "王朝阳", "phone": "", "address": "赵寨", "tools": [{"toolId": "T006", "toolName": "打灰机", "quantity": 1, "unit": "个"}], "seller": "雯妈", "loanDate": "2026-08-25", "expectedReturnDate": "", "actualReturnDate": "2026-08-28", "deposit": 0, "note": "", "status": "returned", "createdAt": "2026-08-25T00:22:11.997Z"}, {"id": "TL1787803323997", "borrower": "王燕峰", "phone": "18237538527", "address": "狮子口", "tools": [{"toolId": "T008", "toolName": "热溶机", "quantity": 1, "unit": "把"}, {"toolId": "T009", "toolName": "剪刀", "quantity": 1, "unit": "把"}], "seller": "雯雯", "loanDate": "2026-08-27", "expectedReturnDate": "", "actualReturnDate": "2026-08-27", "deposit": 50, "note": "", "status": "returned", "createdAt": "2026-08-27T04:02:03.997Z"}, {"id": "TL1788067658437", "borrower": "张自飞", "phone": "15617367938", "address": "刘七", "tools": [{"toolId": "T004", "toolName": "胶枪", "quantity": 1, "unit": "把"}], "seller": "雯妈", "loanDate": "2026-08-30", "expectedReturnDate": "", "actualReturnDate": "2026-08-30", "deposit": 0, "note": "", "status": "returned", "createdAt": "2026-08-30T05:27:38.437Z"}];

function log(msg, type) {
  const div = document.getElementById('log');
  const span = document.createElement('span');
  if (type === 'ok') span.className = 'ok';
  if (type === 'err') span.className = 'err';
  span.textContent = msg + '\n';
  div.appendChild(span);
  div.scrollTop = div.scrollHeight;
}

async function doImport() {
  const btn = document.getElementById('importBtn');
  btn.disabled = true;
  btn.textContent = '导入中...';
  
  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  };

  try {
    // 1. 清空 tools 表
    log('1. 清空 tools 表...');
    let resp = await fetch(SUPABASE_URL + '/rest/v1/tools?id=neq.DELETE_SENTINEL', {
      method: 'DELETE',
      headers: {...headers, 'Prefer': 'return=minimal'}
    });
    log('   tools 表清空完成 (' + resp.status + ')', 'ok');

    // 2. 导入 tools
    log('2. 导入 ' + TOOLS_DATA.length + ' 条工具...');
    const toolsForDb = TOOLS_DATA.map(t => ({
      id: t.id, name: t.name, stock: t.stock, unit: t.unit, note: t.note || ''
    }));
    resp = await fetch(SUPABASE_URL + '/rest/v1/tools', {
      method: 'POST',
      headers: headers,
      body: JSON.stringify(toolsForDb)
    });
    const toolsResult = await resp.json();
    log('   工具导入成功: ' + toolsResult.length + ' 条', 'ok');

    // 3. 清空 tool_loans 表
    log('3. 清空 tool_loans 表...');
    resp = await fetch(SUPABASE_URL + '/rest/v1/tool_loans?id=neq.DELETE_SENTINEL', {
      method: 'DELETE',
      headers: {...headers, 'Prefer': 'return=minimal'}
    });
    log('   tool_loans 表清空完成 (' + resp.status + ')', 'ok');

    // 4. 导入 tool_loans
    log('4. 导入 ' + LOANS_DATA.length + ' 条借出记录...');
    const loansForDb = LOANS_DATA.map(l => ({
      id: l.id, borrower: l.borrower, phone: l.phone || '', address: l.address || '',
      tools: l.tools, seller: l.seller || '',
      loan_date: l.loanDate, expected_return_date: l.expectedReturnDate || '',
      actual_return_date: l.actualReturnDate || '',
      deposit: l.deposit || 0, note: l.note || '', status: l.status,
      created_at: l.createdAt
    }));
    resp = await fetch(SUPABASE_URL + '/rest/v1/tool_loans', {
      method: 'POST',
      headers: headers,
      body: JSON.stringify(loansForDb)
    });
    const loansResult = await resp.json();
    log('   借出记录导入成功: ' + loansResult.length + ' 条', 'ok');
    
    // 验证
    log('\n=== 验证 ===');
    log('工具: ' + toolsResult.length + ' 条 (预期 9)');
    log('借出记录: ' + loansResult.length + ' 条 (预期 10)');
    if (toolsResult.length === 9 && loansResult.length === 10) {
      log('\n✅ 全部导入成功！请刷新网页版查看。', 'ok');
    } else {
      log('\n⚠️ 数量不匹配，请检查。', 'err');
    }
    
    btn.textContent = '导入完成';
  } catch (e) {
    log('错误: ' + e.message, 'err');
    btn.disabled = false;
    btn.textContent = '重新导入';
  }
}
</script>
