<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雯雯的小店 · 下载最新版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #eef5ff 0%, #f7f9fc 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; color: #1f2937;
  }
  .card {
    background: #fff; border-radius: 24px; padding: 32px 28px; max-width: 420px; width: 100%;
    box-shadow: 0 12px 40px rgba(30, 80, 160, .12); text-align: center;
  }
  .icon { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 16px;
    background: linear-gradient(135deg, #4a9fff, #0e5ddb); display: flex;
    align-items: center; justify-content: center; color: #fff; font-size: 34px; font-weight: 700; }
  h1 { font-size: 20px; margin-bottom: 6px; }
  .ver { color: #0e5ddb; font-weight: 600; font-size: 15px; margin-bottom: 18px; }
  .notes {
    background: #f4f8fe; border-radius: 14px; padding: 14px 16px; text-align: left;
    font-size: 14px; line-height: 1.7; color: #475569; margin-bottom: 22px;
  }
  .btn {
    display: block; width: 100%; padding: 15px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #4a9fff, #0e5ddb); color: #fff; font-size: 17px;
    font-weight: 600; text-decoration: none; cursor: pointer;
  }
  .btn:active { opacity: .85; }
  .hint { margin-top: 14px; font-size: 12.5px; color: #94a3b8; line-height: 1.6; }
  .wechat-tip {
    display: none; margin-top: 12px; padding: 10px 12px; border-radius: 10px;
    background: #fff7e6; color: #b26a00; font-size: 12.5px; line-height: 1.6;
  }
  .loading { color: #94a3b8; font-size: 14px; padding: 20px 0; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">雯</div>
    <h1>雯雯的小店</h1>
    <div class="ver" id="ver">正在获取最新版本…</div>
    <div class="notes" id="notes" style="display:none"></div>
    <a class="btn" id="dl" style="display:none" href="#">下载安装最新版</a>
    <div class="loading" id="loading">加载中…</div>
    <div class="wechat-tip" id="wechatTip">
      若点击后无法下载：请点右上角「···」选择「在浏览器中打开」，再点下载。<br>
      安装时如提示“未知来源”，允许本次安装即可。
    </div>
    <div class="hint">安卓版 · 销售库存数据保存在云端，登录后自动同步</div>
  </div>
<script>
  var BASE = "https://smamozhqfiabrnpohpwe.supabase.co/storage/v1/object/public/app-updates";
  // Permanent latest APK lives next to the manifest, so this page never changes.
  var LATEST_URL = BASE + "/wenwen-shop-latest.apk";
  var ua = navigator.userAgent.toLowerCase();
  var isWeChat = /micromessenger/.test(ua);
  if (isWeChat) document.getElementById("wechatTip").style.display = "block";

  fetch(BASE + "/updates/manifest.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (m) {
      document.getElementById("loading").style.display = "none";
      document.getElementById("ver").textContent = "最新版本 v" + m.latestVersionName;
      var notes = document.getElementById("notes");
      if (m.releaseNotes) { notes.textContent = m.releaseNotes; notes.style.display = "block"; }
      var dl = document.getElementById("dl");
      dl.href = m.apkUrl || LATEST_URL;
      dl.style.display = "block";
    })
    .catch(function () {
      // Manifest unreachable: still offer the permanent latest URL.
      document.getElementById("loading").style.display = "none";
      document.getElementById("ver").textContent = "点击下载最新版";
      var dl = document.getElementById("dl");
      dl.href = LATEST_URL;
      dl.style.display = "block";
    });
</script>
</body>
</html>
